name: Build Windows VST3

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.9-${{ runner.os }}-v1

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target Smartscope_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Smartscope-VST3-Windows
          path: build/Smartscope_artefacts/Release/VST3/
          if-no-files-found: error

      # ---- Releases: on main, when the version in CMakeLists.txt has no release yet ----

      - name: Check version
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(Smartscope VERSION ([0-9.]+)\)'
          $version = $m.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v$version is already released, nothing to publish"
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Publishing v$version"
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Zip plugin
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path build/Smartscope_artefacts/Release/VST3/Smartscope.vst3 `
                           -DestinationPath "Smartscope-v${{ steps.version.outputs.version }}-Windows-VST3.zip"

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $pattern = '^## \[' + [regex]::Escape($version) + '\]'
          $notes = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') {
              if ($inside) { break }
              if ($line -match $pattern) { $inside = $true; continue }
            }
            if ($inside) { $notes += $line }
          }
          $notes += ''
          $notes += '### Install'
          $notes += 'Unzip and copy the `Smartscope.vst3` folder to `C:\Program Files\Common Files\VST3\`, then rescan plugins in your DAW.'
          $notes -join "`n" | Out-File -Encoding utf8 release-notes.md

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Smartscope v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: Smartscope-v${{ steps.version.outputs.version }}-Windows-VST3.zip
